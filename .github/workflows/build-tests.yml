        diff -u expected/pascal.html.json     pascal.html.json
    - name: 'Build project: plagueorders'
      run: |
        cd tests/plagueorders
        python3 ../../ppgen.py -i plagueorders-src.txt -a
        diff -u expected/plagueorders-utf8.txt      plagueorders-utf8.txt
