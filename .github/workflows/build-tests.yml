
name: ppgen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: 'read'

jobs:
  build:

    runs-on: 'ubuntu-latest'

    steps:
    - uses: 'actions/checkout@v3'
    - name: 'Set up Python 3.10'
      uses: 'actions/setup-python@v3'
      with:
        python-version: '3.10'
    - name: 'Build project: abolish'
      run: |
        cd tests/abolish
        python3 ../../ppgen.py -i abolish-src.txt -a
        diff -u expected/abolish-utf8.txt      abolish-utf8.txt
        diff -u expected/abolish-utf8.txt.bin  abolish-utf8.txt.bin
        diff -u expected/abolish-utf8.txt.json abolish-utf8.txt.json
        diff -u expected/abolish.html          abolish.html
        diff -u expected/abolish.html.bin      abolish.html.bin
        diff -u expected/abolish.html.json     abolish.html.json
    - name: 'Build project: eugenics'
      run: |
        cd tests/eugenics
        python3 ../../ppgen.py -i eugenics-src.txt -a
        diff -u expected/eugenics-utf8.txt      eugenics-utf8.txt
        diff -u expected/eugenics-utf8.txt.bin  eugenics-utf8.txt.bin
        diff -u expected/eugenics-utf8.txt.json eugenics-utf8.txt.json
        diff -u expected/eugenics.html          eugenics.html
        diff -u expected/eugenics.html.bin      eugenics.html.bin
        diff -u expected/eugenics.html.json     eugenics.html.json
    - name: 'Build project: pascal'
