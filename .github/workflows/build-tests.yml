        diff -u expected/vaxfacts.html          vaxfacts.html
        diff -u expected/vaxfacts.html.bin      vaxfacts.html.bin
        diff -u expected/vaxfacts.html.json     vaxfacts.html.json
    - name: 'Build project: worshiph'
      run: |
        cd tests/worshiph
